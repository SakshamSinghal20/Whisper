[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "whisper-indexer"
version = "0.2.0"
description = "Bitcoin Taproot indexer and local Silent Payments receiver"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3", "aiosqlite>=0.20,<1", "asyncpg>=0.30,<1",
  "pydantic-settings>=2.6,<3", "coincurve>=21,<22", "pyzmq>=26,<28",
  "tornado>=6.4,<7; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
whisper = "whisper.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["whisper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
